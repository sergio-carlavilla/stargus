name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Apple Clang / arm64
    runs-on: macos-15
    timeout-minutes: 60

    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      STARGUS_INSTALL_DIR: ${{ github.workspace }}/install

    steps:
      - name: Checkout Stargus
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Checkout Stratagus
        uses: actions/checkout@v7
        with:
          repository: sergio-carlavilla/stratagus
          path: stratagus-engine
          submodules: recursive

      - name: Install dependencies
        shell: bash
        run: |
          brew install \
            pkgconf \
            zlib \
            libpng \
            libogg \
            libvorbis \
            sdl2 \
            sdl2_image \
            sdl2_mixer \
            stormlib \
            nlohmann-json \
            imagemagick \
            ffmpeg

          HOMEBREW_PREFIX="$(brew --prefix)"

          {
            echo "HOMEBREW_PREFIX=$HOMEBREW_PREFIX"
            echo "CMAKE_PREFIX_PATH=$HOMEBREW_PREFIX"
            echo "PKG_CONFIG_PATH=$HOMEBREW_PREFIX/lib/pkgconfig:$HOMEBREW_PREFIX/share/pkgconfig"
          } >> "$GITHUB_ENV"

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.3.4"

      - name: Show build environment
        shell: bash
        run: |
          uname -a
          uname -m
          clang --version
          cmake --version
          brew --prefix
          python3 --version
          ffmpeg -version
          ffmpeg -v error -f lavfi -i color=c=red:s=8x8:r=10 \
            -frames:v 1 -codec:v libvpx-vp9 -f null -
          magick -version

      - name: Configure Stratagus
        shell: bash
        run: |
          cmake \
            -S stratagus-engine \
            -B stratagus-engine/build \
            -DCMAKE_BUILD_TYPE=Debug \
            "-DCMAKE_PREFIX_PATH=$HOMEBREW_PREFIX" \
            -DBUILD_VENDORED_LUA=ON \
            -DBUILD_VENDORED_SDL=OFF \
            -DBUILD_VENDORED_MEDIA_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DENABLE_NSIS=OFF \
            -DWITH_MNG=OFF \
            -DWITH_OGGVORBIS=OFF \
            -DWITH_THEORA=OFF \
            -DWITH_STACKTRACE=OFF

      - name: Build Stratagus
        shell: bash
        run: |
          cmake --build stratagus-engine/build --parallel 2

      - name: Locate Stratagus executable
        shell: bash
        run: |
          STRATAGUS_EXECUTABLE=""

          while IFS= read -r candidate; do
            if [[ -x "$candidate" ]]; then
              STRATAGUS_EXECUTABLE="$(cd "$(dirname "$candidate")" && pwd)/$(basename "$candidate")"
              break
            fi
          done < <(
            find stratagus-engine/build -type f \
              \( -name 'stratagus' -o -name 'stratagus-dbg' \)
          )

          if [[ -z "$STRATAGUS_EXECUTABLE" ]]; then
            echo "Stratagus executable was not found."
            find stratagus-engine/build -type f | sort
            exit 1
          fi

          STRATAGUS_INCLUDE_DIR="$GITHUB_WORKSPACE/stratagus-engine/gameheaders"

          if [[ ! -d "$STRATAGUS_INCLUDE_DIR" ]]; then
            echo "Stratagus include directory was not found: $STRATAGUS_INCLUDE_DIR"
            exit 1
          fi

          echo "Stratagus executable: $STRATAGUS_EXECUTABLE"
          echo "Stratagus include dir: $STRATAGUS_INCLUDE_DIR"

          echo "STRATAGUS_EXECUTABLE=$STRATAGUS_EXECUTABLE" >> "$GITHUB_ENV"
          echo "STRATAGUS_INCLUDE_DIR=$STRATAGUS_INCLUDE_DIR" >> "$GITHUB_ENV"

      - name: Configure Startool4 and Stargus
        shell: bash
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            "-DCMAKE_PREFIX_PATH=$HOMEBREW_PREFIX" \
            "-DCMAKE_INSTALL_PREFIX=$STARGUS_INSTALL_DIR" \
            -DBUILD_TESTING=ON \
            "-DPython3_EXECUTABLE=$(command -v python3)" \
            -DWITH_CASCLIB=OFF \
            "-DStratagus_EXECUTABLE=$STRATAGUS_EXECUTABLE" \
            "-DStratagus_INCLUDE_DIR=$STRATAGUS_INCLUDE_DIR"

      - name: Build Startool4 and Stargus
        shell: bash
        run: |
          cmake --build build --parallel 2

      - name: Run tests
        shell: bash
        run: |
          ctest --test-dir build --no-tests=error --output-on-failure

      - name: Install Startool4 and Stargus
        shell: bash
        run: |
          cmake --install build

      - name: Verify installation
        shell: bash
        run: |
          python3 .github/scripts/verify_install.py "$STARGUS_INSTALL_DIR" --desktop
