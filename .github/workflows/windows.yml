name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: MSVC x64
    runs-on: windows-2022
    timeout-minutes: 60

    env:
      VCPKG_TRIPLET: x64-windows
      STARGUS_INSTALL_DIR: ${{ github.workspace }}/install

    steps:
      - name: Checkout Stargus
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Checkout Stratagus
        uses: actions/checkout@v7
        with:
          repository: sergio-carlavilla/stratagus
          path: stratagus-engine
          submodules: recursive

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.3.4"

      - name: Install dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            zlib `
            libpng `
            libogg `
            libvorbis `
            bzip2 `
            sdl2 `
            sdl2-image `
            sdl2-mixer `
            stormlib `
            nlohmann-json `
            --triplet $env:VCPKG_TRIPLET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          "$env:VCPKG_INSTALLATION_ROOT\installed\$env:VCPKG_TRIPLET\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          "$env:VCPKG_INSTALLATION_ROOT\installed\$env:VCPKG_TRIPLET\debug\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify media tools
        shell: pwsh
        run: |
          python --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffmpeg -v error -f lavfi -i color=c=red:s=8x8:r=10 `
            -frames:v 1 -codec:v libvpx-vp9 -f null -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          magick -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure Stratagus
        shell: pwsh
        run: |
          cmake `
            -S stratagus-engine `
            -B stratagus-engine/build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            "-DCMAKE_PREFIX_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\$env:VCPKG_TRIPLET" `
            -DBUILD_VENDORED_LUA=ON `
            -DBUILD_VENDORED_SDL=OFF `
            -DBUILD_VENDORED_MEDIA_LIBS=OFF `
            -DBUILD_TESTING=OFF `
            -DENABLE_NSIS=OFF `
            -DWITH_MNG=OFF `
            -DWITH_OGGVORBIS=OFF `
            -DWITH_THEORA=OFF `
            -DWITH_STACKTRACE=OFF

      - name: Build Stratagus
        shell: pwsh
        run: |
          cmake --build stratagus-engine/build --config Debug --parallel 2

      - name: Locate Stratagus executable
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:GITHUB_WORKSPACE "stratagus-engine\build"

          $candidates = Get-ChildItem `
            -Path $buildDir `
            -Recurse `
            -File `
            -Filter "stratagus*.exe" |
            Where-Object {
              $_.Name -eq "stratagus.exe" -or
              $_.Name -eq "stratagus-dbg.exe"
            }

          $exe = $candidates |
            Where-Object { $_.Name -eq "stratagus-dbg.exe" } |
            Select-Object -First 1

          if (-not $exe) {
            $exe = $candidates | Select-Object -First 1
          }

          if (-not $exe) {
            Write-Host "Stratagus executable was not found."
            Get-ChildItem -Path $buildDir -Recurse -File |
              Select-Object FullName
            exit 1
          }

          $includeDir = Join-Path $env:GITHUB_WORKSPACE "stratagus-engine\gameheaders"

          Write-Host "Stratagus executable: $($exe.FullName)"
          Write-Host "Stratagus include dir: $includeDir"

          "STRATAGUS_EXECUTABLE=$($exe.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "STRATAGUS_INCLUDE_DIR=$includeDir" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure Startool4 and Stargus
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          cmake `
            -S . `
            -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            "-DCMAKE_PREFIX_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\$env:VCPKG_TRIPLET" `
            "-DCMAKE_INSTALL_PREFIX=$env:STARGUS_INSTALL_DIR" `
            -DBUILD_TESTING=ON `
            "-DPython3_EXECUTABLE=$python" `
            -DENABLE_NSIS=OFF `
            -DWITH_CASCLIB=OFF `
            "-DStratagus_EXECUTABLE=$env:STRATAGUS_EXECUTABLE" `
            "-DStratagus_INCLUDE_DIR=$env:STRATAGUS_INCLUDE_DIR"

      - name: Build Startool4 and Stargus
        shell: pwsh
        run: |
          cmake --build build --config Debug --parallel 2

      - name: Run tests
        shell: pwsh
        run: |
          ctest `
            --test-dir build `
            -C Debug `
            --no-tests=error `
            --output-on-failure

      - name: Install Startool4 and Stargus
        shell: pwsh
        run: |
          cmake `
            --install build `
            --config Debug

      - name: Verify installation
        shell: pwsh
        run: |
          python .github/scripts/verify_install.py "$env:STARGUS_INSTALL_DIR"
